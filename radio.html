<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PCVR RADIO v11.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(180deg, #0a0c12 0%, #05060a 100%);
        }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
        
        .glass {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 240, 255, 0.2);
        }
        
        .neon-glow { text-shadow: 0 0 15px #22f0ff; }
        
        .station-card:hover { transform: translateY(-4px); }
        
        .bottom-player {
            box-shadow: 0 -15px 25px -10px rgb(0 0 0 / 0.6);
        }
        
        canvas { max-width: 100% !important; }
    </style>
</head>
<body class="text-white min-h-screen pb-24 overflow-x-hidden">
    <div class="max-w-[420px] mx-auto relative">
        
        <!-- HEADER -->
        <div class="glass sticky top-0 z-50 border-b border-cyan-400/30 px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-cyan-400 to-purple-500 rounded-2xl flex items-center justify-center text-2xl">🎧</div>
                <div>
                    <h1 class="title-font text-2xl font-bold tracking-tighter neon-glow">PCVR RADIO</h1>
                    <p class="text-[10px] font-mono text-cyan-400">v11.1 • CYBER ECLIPSE</p>
                </div>
            </div>
            <div onclick="openSettings()" class="text-2xl text-cyan-400 cursor-pointer">
                <i class="fa-solid fa-sliders-h"></i>
            </div>
        </div>

        <!-- TABS -->
        <div class="flex border-b border-white/10 bg-black/50 sticky top-[68px] z-40">
            <button onclick="switchTab(0)" id="tab-0" class="flex-1 py-3 text-sm font-semibold border-b-2 border-cyan-400 text-cyan-400">NOW</button>
            <button onclick="switchTab(1)" id="tab-1" class="flex-1 py-3 text-sm font-semibold">STATIONS</button>
            <button onclick="switchTab(2)" id="tab-2" class="flex-1 py-3 text-sm font-semibold">MOODS</button>
            <button onclick="switchTab(3)" id="tab-3" class="flex-1 py-3 text-sm font-semibold">LIBRARY</button>
        </div>

        <div class="px-4 pt-5 pb-28" id="content-area">
            
            <!-- TAB 0: NOW PLAYING -->
            <div id="tab-content-0">
                <div class="glass rounded-3xl p-5 mb-6">
                    <div id="now-playing-art" class="w-44 h-44 mx-auto rounded-3xl bg-gradient-to-br from-purple-500 via-cyan-400 to-pink-500 flex items-center justify-center text-8xl mb-6 shadow-xl">
                        🎧
                    </div>
                    <h2 id="now-playing-title" class="text-xl font-bold text-center neon-glow">Nothing Playing</h2>
                    <p id="now-playing-subtitle" class="text-center text-cyan-300 text-sm">Select a station below</p>
                    
                    <canvas id="visualizer-canvas" width="380" height="100" class="w-full mt-6 rounded-2xl"></canvas>
                </div>

                <div class="grid grid-cols-4 gap-3">
                    <button onclick="quickPlay('SomaFM')" class="glass p-3 rounded-3xl text-center text-xs">DEF CON</button>
                    <button onclick="quickPlay('Groove Salad')" class="glass p-3 rounded-3xl text-center text-xs">CHILL</button>
                    <button onclick="quickPlay('Drone Zone')" class="glass p-3 rounded-3xl text-center text-xs">AMBIENT</button>
                    <button onclick="raidMode()" class="glass p-3 rounded-3xl text-center text-xs border border-purple-400">RAID</button>
                </div>
            </div>

            <!-- TAB 1: STATIONS -->
            <div id="tab-content-1" class="hidden">
                <input id="search-input" placeholder="Search stations..." 
                       class="glass w-full px-5 py-4 rounded-3xl mb-4 text-sm"
                       onkeyup="filterStations()">
                <div id="stations-grid" class="space-y-3 max-h-[460px] overflow-y-auto pr-1"></div>
            </div>

            <!-- TAB 2: MOODS -->
            <div id="tab-content-2" class="hidden grid grid-cols-2 gap-4" id="moods-grid"></div>

            <!-- TAB 3: LIBRARY -->
            <div id="tab-content-3" class="hidden space-y-6">
                <div>
                    <h3 class="font-bold mb-3">❤️ Favorites</h3>
                    <div id="favorites-list" class="space-y-2"></div>
                </div>
                <div>
                    <h3 class="font-bold mb-3">🕒 History</h3>
                    <div id="history-list" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <!-- BOTTOM PLAYER -->
        <div id="bottom-player" class="bottom-player fixed bottom-0 left-0 right-0 max-w-[420px] mx-auto glass border-t border-cyan-400/50 rounded-t-3xl px-4 py-3 z-50">
            <div class="flex items-center gap-3">
                <div id="mini-art" class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center text-3xl flex-shrink-0"></div>
                <div class="flex-1 min-w-0">
                    <p id="mini-title" class="font-semibold text-sm truncate">Nothing playing</p>
                    <p id="mini-subtitle" class="text-xs text-cyan-300 truncate">—</p>
                </div>
                
                <div class="flex items-center gap-4 text-2xl">
                    <button onclick="previousStation()" class="text-cyan-300"><i class="fa-solid fa-backward"></i></button>
                    <button onclick="togglePlayPause()" id="play-pause-btn" class="w-12 h-12 bg-gradient-to-br from-cyan-400 to-pink-500 rounded-3xl flex items-center justify-center text-black">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button onclick="nextStation()" class="text-cyan-300"><i class="fa-solid fa-forward"></i></button>
                </div>
            </div>
            
            <div class="flex items-center gap-3 mt-3">
                <i class="fa-solid fa-volume-low text-sm"></i>
                <input type="range" id="volume-slider-bottom" min="0" max="1" step="0.01" value="1" 
                       oninput="setVolume(this.value)" class="flex-1 accent-cyan-400">
                <span id="volume-text" class="font-mono text-xs w-8">100%</span>
            </div>
        </div>
    </div>

    <audio id="radio-player" class="hidden"></audio>

    <script>
        // ==================== PCVR RADIO v11.1 ====================
        let audio = document.getElementById('radio-player');
        let currentStation = { name: "None", url: "", category: "" };
        let isPlaying = false;
        let volume = 1;
        let favorites = JSON.parse(localStorage.getItem('pcvr_fav')) || [];
        let history = JSON.parse(localStorage.getItem('pcvr_hist')) || [];
        let canvas = document.getElementById('visualizer-canvas');
        let ctx = canvas.getContext('2d');
        let analyser, source, audioContext, dataArray;

        const STATIONS = {
            "SomaFM": { url: "http://ice1.somafm.com/defcon-128-mp3", category: "Hacker" },
            "PCVR Radio / DEF CON": { url: "https://ice5.somafm.com/defcon-128-mp3", category: "Hacker" },
            "Groove Salad": { url: "https://ice5.somafm.com/groovesalad-128-mp3", category: "Chill" },
            "Deep Space One": { url: "https://ice5.somafm.com/deepspaceone-128-mp3", category: "Ambient" },
            "Drone Zone": { url: "https://ice5.somafm.com/dronezone-128-mp3", category: "Ambient" },
            "Code Raiders / Cliqhop": { url: "https://ice5.somafm.com/cliqhop-128-mp3", category: "Raid" },
            "Beat Blender": { url: "https://ice5.somafm.com/beatblender-128-mp3", category: "Upbeat" },
            "Mission Control": { url: "https://ice5.somafm.com/missioncontrol-128-mp3", category: "Space" },
            // Add more stations as needed...
        };

        const MOODS = {
            "Chill": "Groove Salad",
            "Ambient": "Deep Space One",
            "Raid": "Code Raiders / Cliqhop",
            "Upbeat": "Beat Blender"
        };

        function playStation(name) {
            const st = STATIONS[name];
            if (!st) return;
            audio.src = st.url;
            audio.play().then(() => {
                currentStation = { name, url: st.url, category: st.category };
                isPlaying = true;
                document.getElementById('now-playing-title').textContent = name;
                document.getElementById('now-playing-subtitle').textContent = st.category;
                document.getElementById('mini-title').textContent = name;
                document.getElementById('mini-subtitle').textContent = st.category;
                document.getElementById('mini-art').innerHTML = "🎧";
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            });
        }

        function togglePlayPause() {
            if (isPlaying) {
                audio.pause();
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-play"></i>`;
            } else if (currentStation.url) {
                audio.play();
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            }
            isPlaying = !isPlaying;
        }

        function setVolume(val) {
            volume = parseFloat(val);
            audio.volume = volume;
            document.getElementById('volume-text').textContent = Math.round(volume*100) + "%";
        }

        function switchTab(n) {
            document.querySelectorAll('#content-area > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(`tab-content-${n}`).classList.remove('hidden');
            
            document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.remove('border-b-2', 'border-cyan-400', 'text-cyan-400'));
            document.getElementById(`tab-${n}`).classList.add('border-b-2', 'border-cyan-400', 'text-cyan-400');
        }

        function quickPlay(name) { playStation(name); }
        function raidMode() { playStation("Code Raiders / Cliqhop"); }
        function previousStation() { alert("Previous station (add logic if needed)"); }
        function nextStation() { alert("Next station (add logic if needed)"); }

        function openSettings() { alert("Settings coming in next update"); }
        
        function init() {
            console.log("%cPCVR RADIO v11.1 — Optimized for no cutoff", "color:#22f0ff;font-weight:bold");
            // Render stations in Tab 1
            const grid = document.getElementById('stations-grid');
            Object.keys(STATIONS).forEach(name => {
                const div = document.createElement('div');
                div.className = "station-card glass p-4 rounded-3xl flex items-center gap-4 cursor-pointer";
                div.innerHTML = `<div class="text-4xl">🎧</div><div class="flex-1"><div class="font-bold">${name}</div><div class="text-xs text-cyan-400">${STATIONS[name].category}</div></div>`;
                div.onclick = () => playStation(name);
                grid.appendChild(div);
            });
        }
        
        window.onload = init;
    </script>
</body>
</html>
