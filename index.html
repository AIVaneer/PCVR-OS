<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCVR OS V7</title>

<style>
body{
margin:0;
font-family:-apple-system,Arial;
background:#05070c;
color:white;
overflow:hidden;
}

.container{display:flex;height:100vh;}

.sidebar{
width:200px;
background:#020617;
padding:14px;
}

.logo{
font-size:22px;
color:#4ade80;
margin-bottom:20px;
}

.nav-btn{
width:100%;
padding:14px;
margin:6px 0;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
text-align:left;
transition:.2s;
}

.nav-btn.active{
background:#38bdf8;
color:black;
}

.main{
flex:1;
position:relative;
overflow:hidden;
}

.page{
position:absolute;
inset:0;
padding:16px;
overflow:auto;
opacity:0;
transform:translateX(40px);
transition:.3s;
}

.page.active{
opacity:1;
transform:translateX(0);
}

.app{
background:#0f172a;
padding:16px;
border-radius:16px;
margin-bottom:12px;
display:flex;
align-items:center;
gap:12px;
transition:.15s;
}

.app:active{
transform:scale(.96);
}

.icon{
width:50px;
height:50px;
border-radius:12px;
background:#38bdf8;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
}

.install-btn{
margin-left:auto;
background:#4ade80;
border:none;
padding:6px 12px;
border-radius:10px;
font-weight:bold;
}

.window{
position:fixed;
inset:0;
background:black;
display:none;
flex-direction:column;
z-index:10;
}

.window.active{display:flex;}

.bar{
background:#020617;
padding:10px;
display:flex;
justify-content:space-between;
}

iframe{
flex:1;
border:none;
}

.xp-pop{
position:fixed;
top:20px;
right:20px;
background:#4ade80;
color:black;
padding:10px 16px;
border-radius:12px;
opacity:0;
transform:translateY(-20px);
transition:.3s;
z-index:20;
}

.xp-pop.show{
opacity:1;
transform:translateY(0);
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<div class="logo">PCVR OS</div>

<button class="nav-btn active" onclick="goPage(0)">🚀 Portal</button>
<button class="nav-btn" onclick="goPage(1)">🎮 Arcade</button>
<button class="nav-btn" onclick="goPage(2)">🌍 Worlds</button>
<button class="nav-btn" onclick="goPage(3)">🎧 Radio</button>
<button class="nav-btn" onclick="goPage(4)">📊 Stats</button>
</div>

<div class="main" id="main">

<!-- PORTAL -->
<div class="page active">
<h2>PCVR Portal</h2>

<div class="app" onclick="openPortal()">
<div class="icon">🌐</div>
Open Main Portal
</div>

</div>

<!-- ARCADE -->
<div class="page">
<h2>Arcade</h2>

<div class="app">
<div class="icon">🔥</div>
Sky Burner
<button class="install-btn" onclick="install(this,'sky')">Install</button>
</div>

<div class="app">
<div class="icon">🧠</div>
Boss Logic
<button class="install-btn" onclick="install(this,'boss')">Install</button>
</div>

</div>

<!-- WORLDS -->
<div class="page">
<h2>Worlds</h2>

<div class="app" onclick="openPortal()">
<div class="icon">🌍</div>
Open Code Raiders Worlds
</div>

</div>

<!-- RADIO -->
<!-- RADIO -->
<div class="page">
<h2>Radio</h2>

<div class="app" onclick="playRadio()">
<div class="icon">▶</div>
Play Radio
</div>

<div class="app" onclick="pauseRadio()">
<div class="icon">⏸</div>
Stop Radio
</div>

<div class="app" onclick="prevStation()">
<div class="icon">⏮</div>
Previous Station
</div>

<div class="app" onclick="nextStation()">
<div class="icon">⏭</div>
Next Station
</div>

<div class="app" onclick="shuffleStation()">
<div class="icon">🎲</div>
Shuffle Station
</div>

<p id="stationLabel">Station: Deep Space One</p>

</div>

<!-- STATS -->
<div class="page">
<h2>Stats</h2>
<p id="xp">XP: 0</p>
<p id="lvl">Level: 1</p>
</div>

</div>
</div>

<div class="window" id="win">
<div class="bar">
<span id="title">App</span>
<button onclick="closeGame()">Close</button>
</div>
<iframe id="frame"></iframe>
</div>

<div class="xp-pop" id="xpPop">+5 XP</div>

<script>

/* DATA */
let data=JSON.parse(localStorage.getItem("pcvr"))||{xp:0,installed:{}};

/* SOUND (tap feedback) */
function tap(){
try{
let ctx=new (window.AudioContext||window.webkitAudioContext)();
let o=ctx.createOscillator();
let g=ctx.createGain();
o.connect(g); g.connect(ctx.destination);
o.frequency.value=300;
o.start();
g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.1);
}catch(e){}
}

/* XP SYSTEM */
function addXP(){
data.xp+=5;
save();
updateXP();
showXP("+5 XP");
}

function updateXP(){
document.getElementById("xp").innerText="XP: "+data.xp;
document.getElementById("lvl").innerText="Level: "+Math.floor(data.xp/50+1);
}

function showXP(txt){
let pop=document.getElementById("xpPop");
pop.innerText=txt;
pop.classList.add("show");
setTimeout(()=>pop.classList.remove("show"),1200);
}

function save(){
localStorage.setItem("pcvr",JSON.stringify(data));
}

updateXP();

/* NAV */
let pages=document.querySelectorAll(".page");
let index=0;

function goPage(i){
tap();
pages[index].classList.remove("active");
index=i;
pages[index].classList.add("active");

document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
document.querySelectorAll(".nav-btn")[i].classList.add("active");
}

/* SWIPE */
let startX=0;
main.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
main.addEventListener("touchend",e=>{
let diff=e.changedTouches[0].clientX-startX;
if(diff>50 && index>0)goPage(index-1);
if(diff<-50 && index<pages.length-1)goPage(index+1);
});

/* PORTAL */
function openPortal(){
tap();
launch("https://aivaneer.github.io/PCVR-EdTech/code-raiders/portal.html","PCVR Portal");
}

/* GAME */
function launch(url,title){
tap();
document.getElementById("frame").src=url;
document.getElementById("title").innerText=title;
document.getElementById("win").classList.add("active");
addXP();
}

function closeGame(){
document.getElementById("win").classList.remove("active");
document.getElementById("frame").src="";
}

/* INSTALL SYSTEM */
function install(btn,id){
tap();
btn.innerText="Installing...";
btn.disabled=true;

setTimeout(()=>{
btn.innerText="Open";
data.installed[id]=true;
save();

btn.onclick=()=>openPortal();
addXP();
},1000);
}

/* RESTORE INSTALLED APPS */
document.querySelectorAll(".install-btn").forEach((btn,i)=>{
let id=i===0?"sky":"boss";
if(data.installed[id]){
btn.innerText="Open";
btn.onclick=()=>openPortal();
}
});

/* RADIO (FIXED) */
let radio=new Audio();
radio.src="https://ice5.somafm.com/deepspaceone-128-mp3";
radio.loop=true;

function playRadio(){
tap();
radio.pause();
radio.load();

let p=radio.play();
if(p!==undefined){
p.then(()=>{
showXP("Radio Playing 🎧");
}).catch(()=>{
alert("Tap again to start radio");
});
}
}

function pauseRadio(){
tap();
radio.pause();
showXP("Radio Stopped");
}

</script>

</body>
</html>
