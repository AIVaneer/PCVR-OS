<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCVR OS v11.2</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

body{
margin:0;
font-family:'Inter',system-ui;
background:linear-gradient(135deg,#0a0c12,#02040a);
color:white;
overflow:hidden;
height:100vh;
}

.container{display:flex;height:100vh;}

.sidebar{
width:240px;
background:rgba(2,6,23,.95);
backdrop-filter:blur(20px);
border-right:1px solid rgba(56,189,248,.2);
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
font-family:'Space Grotesk';
font-size:28px;
font-weight:700;
color:#4ade80;
margin-bottom:32px;
}

.nav-btn{
padding:14px 18px;
margin:6px 0;
border:none;
border-radius:14px;
background:rgba(15,23,42,.8);
color:white;
text-align:left;
transition:.25s;
display:flex;
gap:12px;
cursor:pointer;
}

.nav-btn:hover{
background:rgba(56,189,248,.15);
transform:translateX(6px);
}

.nav-btn.active{
background:linear-gradient(90deg,#38bdf8,#22d3ee);
color:black;
font-weight:600;
}

.main{
flex:1;
position:relative;
overflow:hidden;
}

.page{
position:absolute;
inset:0;
padding:24px;
overflow:auto;
opacity:0;
transform:translateX(40px);
transition:.35s;
}

.page.active{
opacity:1;
transform:translateX(0);
}

.app{
background:rgba(15,23,42,.85);
padding:18px;
border-radius:18px;
margin-bottom:14px;
display:flex;
align-items:center;
gap:16px;
cursor:pointer;
transition:.2s;
border:1px solid rgba(56,189,248,.1);
}

.app:hover{
transform:translateY(-4px) scale(1.02);
border-color:#38bdf8;
}

.icon{
width:60px;
height:60px;
border-radius:16px;
background:linear-gradient(135deg,#38bdf8,#22d3ee);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

h2{
font-family:'Space Grotesk';
color:#67e8f9;
}

.window{
position:fixed;
inset:0;
background:#05070c;
display:none;
flex-direction:column;
z-index:100;
}

.window.active{display:flex;}

.bar{
background:#020617;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1e2937;
}

iframe{
flex:1;
border:none;
background:black;
}

.xp-pop{
position:fixed;
top:30px;
right:30px;
background:linear-gradient(90deg,#4ade80,#22c55e);
color:black;
padding:14px 22px;
border-radius:14px;
font-weight:bold;
opacity:0;
transform:translateY(-30px);
transition:.3s;
z-index:200;
}

.xp-pop.show{
opacity:1;
transform:translateY(0);
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<div class="logo">PCVR OS</div>

<button class="nav-btn active" onclick="goPage(0)">🚀 Portal</button>
<button class="nav-btn" onclick="goPage(1)">🎮 Arcade</button>
<button class="nav-btn" onclick="goPage(2)">🌍 Worlds</button>
<button class="nav-btn" onclick="goPage(3)">🎧 Radio</button>
<button class="nav-btn" onclick="goPage(4)">📊 Stats</button>
</div>

<div class="main" id="main">

<!-- PORTAL -->
<div class="page active">
<h2>Welcome to the Ecosystem</h2>

<div class="app" onclick="openPortal()">
<div class="icon">🌐</div>
<div>Open Main Portal</div>
</div>

</div>

<!-- ARCADE -->
<div class="page">
<h2>Arcade</h2>

<div class="app" onclick="launch('./sky-burner.html','Sky Burner')">
<div class="icon">🔥</div>
Sky Burner
</div>

<div class="app" onclick="launch('./level-11.html','Boss Logic')">
<div class="icon">🧠</div>
Boss Logic
</div>

</div>

<!-- WORLDS -->
<div class="page">
<h2>Worlds</h2>

<div class="app" onclick="openPortal()">
<div class="icon">🌍</div>
Code Raiders Worlds
</div>

</div>

<!-- RADIO -->
<div class="page">
<h2>PCVR Radio</h2>

<div class="app" onclick="launchRadio()">
<div class="icon">🎧</div>
<div>
<strong>Launch Radio v11</strong><br>
<small style="color:#67e8f9">Full neon system</small>
</div>
</div>

</div>

<!-- STATS -->
<div class="page">
<h2>System Stats</h2>

<p id="xp">XP: 0</p>
<p id="lvl">Level: 1</p>

</div>

</div>
</div>

<!-- WINDOW -->
<div class="window" id="win">
<div class="bar">
<span id="title">App</span>
<button onclick="closeGame()">Close</button>
</div>
<iframe id="frame"></iframe>
</div>

<div class="xp-pop" id="xpPop">+10 XP</div>

<script>

/* DATA */
let data = JSON.parse(localStorage.getItem("pcvr")) || {xp:0};

/* XP */
function addXP(){
data.xp += 10;
localStorage.setItem("pcvr", JSON.stringify(data));
updateXP();
showXP();
}

function updateXP(){
xp.innerText = "XP: " + data.xp;
lvl.innerText = "Level: " + Math.floor(data.xp/50 + 1);
}

function showXP(){
xpPop.classList.add("show");
setTimeout(()=>xpPop.classList.remove("show"),1200);
}

updateXP();

/* NAV */
let pages = document.querySelectorAll(".page");
let currentPage = 0;

function goPage(i){
pages[currentPage].classList.remove("active");
currentPage = i;
pages[currentPage].classList.add("active");

document.querySelectorAll(".nav-btn").forEach((b,idx)=>{
b.classList.toggle("active", idx===i);
});
}

/* LAUNCH SYSTEM */
function launch(url,name){
frame.src = url;
title.innerText = name;
win.classList.add("active");
addXP();
}

function launchRadio(){
frame.src = "radio.html";
title.innerText = "PCVR Radio";
win.classList.add("active");
addXP();
}

/* PORTAL */
function openPortal(){
launch("https://aivaneer.github.io/PCVR-EdTech/code-raiders/portal.html","Portal");
}

/* CLOSE */
function closeGame(){
win.classList.remove("active");
setTimeout(()=>frame.src="",300);
}

/* SWIPE */
let startX = 0;

main.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
main.addEventListener("touchend",e=>{
let diff = e.changedTouches[0].clientX - startX;

if(diff>80 && currentPage>0) goPage(currentPage-1);
if(diff<-80 && currentPage<pages.length-1) goPage(currentPage+1);
});

</script>

</body>
</html>
